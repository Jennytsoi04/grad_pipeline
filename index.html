<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grad Pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">

<script type="application/json" id="app-state">
{"version":1,"owner":"Tsoi Ching Yi","jobs":[]}
</script>

<style>
:root{
  --bg:#F6F8F5; --surface:#FFFFFF; --surface-2:#EFF3EE; --surface-3:#E6ECE7;
  --ink:#131B16; --ink-2:#3D4A43; --muted:#5A6960;
  --line:#DCE4DD; --line-strong:#C0CCC4;
  --accent:#1E5C42; --accent-ink:#FFFFFF; --accent-soft:#E1EDE6; --accent-line:#A9CDB9;
  --warn:#8A5A00; --warn-soft:#FAF0DA;
  --crit:#A32219; --crit-soft:#FAE6E3;
  --shadow:0 1px 2px rgba(19,27,22,.06), 0 8px 24px -12px rgba(19,27,22,.18);
  --shadow-lg:0 24px 60px -20px rgba(19,27,22,.35);
  --r:10px;
  --sans:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --disp:"Bricolage Grotesque","Public Sans",-apple-system,Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1411; --surface:#161D18; --surface-2:#1C241E; --surface-3:#222B25;
    --ink:#E7EEE9; --ink-2:#BCC8C0; --muted:#8B9A91;
    --line:#263029; --line-strong:#3A473E;
    --accent:#6DC79A; --accent-ink:#0F1411; --accent-soft:#172C21; --accent-line:#2E4C3B;
    --warn:#E2AC48; --warn-soft:#2A2213;
    --crit:#F2867B; --crit-soft:#2E1A18;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    --shadow-lg:0 24px 60px -20px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1411; --surface:#161D18; --surface-2:#1C241E; --surface-3:#222B25;
  --ink:#E7EEE9; --ink-2:#BCC8C0; --muted:#8B9A91;
  --line:#263029; --line-strong:#3A473E;
  --accent:#6DC79A; --accent-ink:#0F1411; --accent-soft:#172C21; --accent-line:#2E4C3B;
  --warn:#E2AC48; --warn-soft:#2A2213;
  --crit:#F2867B; --crit-soft:#2E1A18;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lg:0 24px 60px -20px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
html,body{margin:0; padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}

/* ---------- chrome ---------- */
.top{
  position:sticky; top:0; z-index:30; background:var(--bg);
  border-bottom:1px solid var(--line);
  display:flex; flex-wrap:wrap; align-items:baseline; gap:8px 20px;
  padding:16px 20px 12px;
}
.brand{font-family:var(--disp); font-weight:700; font-size:19px; letter-spacing:-.015em; margin:0}
.brand span{color:var(--muted); font-weight:500}
.pipe{display:flex; flex-wrap:wrap; gap:4px; margin-left:auto; font-family:var(--mono); font-size:11.5px}
.pipe button{
  display:flex; align-items:center; gap:6px; background:none; border:1px solid transparent;
  border-radius:999px; padding:4px 9px; cursor:pointer; color:var(--muted);
  transition:background .12s, color .12s;
}
.pipe button:hover{background:var(--surface-2); color:var(--ink-2)}
.pipe button[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent-line); color:var(--ink)}
.pipe b{font-family:var(--sans); font-weight:600; font-size:13px; font-variant-numeric:tabular-nums; color:var(--ink)}
.pipe .lb{text-transform:uppercase; letter-spacing:.07em}

.bar{
  display:flex; flex-wrap:wrap; gap:10px; align-items:center;
  padding:12px 20px; border-bottom:1px solid var(--line);
}
.search{flex:1 1 200px; max-width:340px; position:relative; display:flex; align-items:center}
.search input{
  width:100%; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:7px 11px 7px 30px; color:var(--ink);
}
.search input::placeholder{color:var(--muted)}
.search svg{position:absolute; left:9px; width:14px; height:14px; color:var(--muted); pointer-events:none}
.seg{display:flex; background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r); padding:2px}
.seg button{
  background:none; border:0; border-radius:7px; padding:5px 12px; cursor:pointer;
  font-size:13px; font-weight:500; color:var(--muted);
}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:var(--shadow)}
.btn{
  background:var(--accent); color:var(--accent-ink); border:1px solid transparent;
  border-radius:var(--r); padding:7px 14px; font-weight:600; font-size:13.5px; cursor:pointer;
  white-space:nowrap;
}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--surface); color:var(--ink); border-color:var(--line-strong); font-weight:500}
.btn.ghost:hover{background:var(--surface-2); filter:none}
.btn.danger{background:none; color:var(--crit); border-color:var(--line-strong); font-weight:500}
.btn.sm{padding:5px 10px; font-size:12.5px}
.sync{font-family:var(--mono); font-size:11px; color:var(--muted); margin-left:auto; white-space:nowrap}
.sync[data-s="dirty"]{color:var(--warn)}
.sync[data-s="error"]{color:var(--crit)}

/* ---------- board ---------- */
.board{display:flex; gap:12px; padding:16px 20px 40px; overflow-x:auto; align-items:flex-start}
.col{flex:0 0 252px; display:flex; flex-direction:column; gap:8px}
.col-h{display:flex; align-items:center; gap:7px; padding:0 2px 2px}
.col-h h2{
  margin:0; font-family:var(--mono); font-size:11px; font-weight:500;
  text-transform:uppercase; letter-spacing:.09em; color:var(--muted);
}
.col-h .n{font-family:var(--mono); font-size:11px; color:var(--muted); margin-left:auto}
.drop{
  display:flex; flex-direction:column; gap:8px; min-height:64px; border-radius:var(--r);
  border:1px dashed transparent; padding:2px; transition:border-color .12s, background .12s;
}
.drop.over{border-color:var(--accent-line); background:var(--accent-soft)}
.col-empty{font-size:12.5px; color:var(--muted); padding:10px 4px; font-style:italic}

.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:10px 11px 9px; cursor:pointer; text-align:left; width:100%;
  display:grid; gap:5px; box-shadow:var(--shadow);
  border-left:3px solid var(--line-strong);
  transition:transform .1s, border-color .12s;
}
.card:hover{border-color:var(--line-strong); transform:translateY(-1px)}
.card.dragging{opacity:.4}
.card[data-urg="crit"]{border-left-color:var(--crit)}
.card[data-urg="soon"]{border-left-color:var(--warn)}
.card[data-urg="ok"]{border-left-color:var(--accent)}
.card .co{font-family:var(--disp); font-weight:700; font-size:14.5px; letter-spacing:-.01em; line-height:1.25}
.card .ro{font-size:12.5px; color:var(--ink-2); line-height:1.35}
.card .meta{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:1px}
.chip{
  font-family:var(--mono); font-size:10.5px; padding:2px 6px; border-radius:5px;
  background:var(--surface-2); color:var(--muted); white-space:nowrap;
}
.chip[data-u="crit"]{background:var(--crit-soft); color:var(--crit)}
.chip[data-u="soon"]{background:var(--warn-soft); color:var(--warn)}
.fit{display:flex; gap:2px; margin-left:auto}
.fit i{width:4px; height:4px; border-radius:50%; background:var(--line-strong)}
.fit i.on{background:var(--accent)}

/* ---------- list ---------- */
.listwrap{padding:16px 20px 40px; overflow-x:auto}
table{border-collapse:collapse; width:100%; min-width:720px; font-size:13.5px}
th{
  text-align:left; font-family:var(--mono); font-size:10.5px; font-weight:500;
  text-transform:uppercase; letter-spacing:.09em; color:var(--muted);
  padding:0 12px 8px; border-bottom:1px solid var(--line); white-space:nowrap;
}
td{padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
td .co{font-family:var(--disp); font-weight:700; font-size:14px}
td .ro{font-size:12.5px; color:var(--muted)}
td.num{font-family:var(--mono); font-size:12px; font-variant-numeric:tabular-nums; white-space:nowrap}
.stg{
  display:inline-block; font-family:var(--mono); font-size:10.5px; padding:2px 7px;
  border-radius:5px; background:var(--surface-2); color:var(--ink-2); white-space:nowrap;
}
.stg[data-s="offer"]{background:var(--accent-soft); color:var(--accent)}
.stg[data-s="closed"]{color:var(--muted)}

/* ---------- empty ---------- */
.empty{max-width:600px; margin:64px auto; padding:0 24px; text-align:center}
.empty h2{font-family:var(--disp); font-size:22px; font-weight:700; letter-spacing:-.02em; margin:0 0 10px; text-wrap:balance}
.empty p{color:var(--ink-2); margin:0 auto 20px; max-width:46ch}
.empty ol{
  text-align:left; color:var(--ink-2); font-size:14px; background:var(--surface);
  border:1px solid var(--line); border-radius:var(--r); padding:16px 20px 16px 38px; margin:24px 0 0;
}
.empty li{margin:0 0 8px} .empty li:last-child{margin:0}
.empty code{font-family:var(--mono); font-size:12px; background:var(--surface-2); padding:1px 5px; border-radius:4px}

/* ---------- panels ---------- */
.scrim{
  position:fixed; inset:0; background:rgba(10,16,12,.42); z-index:40;
  opacity:0; pointer-events:none; transition:opacity .18s;
}
.scrim.on{opacity:1; pointer-events:auto}
.panel{
  position:fixed; top:0; right:0; bottom:0; z-index:50;
  width:min(760px,100%);
  background:var(--surface); border-left:1px solid var(--line); box-shadow:var(--shadow-lg);
  transform:translateX(100%); transition:transform .22s cubic-bezier(.32,.72,0,1), width .22s ease;
  display:flex; flex-direction:column;
}
.panel.on{transform:none}
.panel.wide{width:100%; border-left:0}
.panel-h{
  display:flex; align-items:flex-start; gap:12px; padding:18px 22px 14px;
  border-bottom:1px solid var(--line);
}
.panel-h .who{min-width:0; flex:1 1 auto}
.panel-h h2{font-family:var(--disp); font-size:21px; font-weight:700; letter-spacing:-.02em; margin:0 0 2px; line-height:1.2; overflow-wrap:anywhere}
.panel-h p{margin:0; color:var(--ink-2); font-size:13.5px; overflow-wrap:anywhere}
.hbtns{display:flex; align-items:center; gap:6px; flex:0 0 auto}
.icb{
  background:none; border:1px solid var(--line-strong); color:var(--muted); cursor:pointer;
  padding:5px 9px; border-radius:8px; display:flex; align-items:center; gap:6px;
  font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.07em;
}
.icb:hover{background:var(--surface-2); color:var(--ink)}
.icb svg{width:13px; height:13px}
.x{background:none; border:0; color:var(--muted); cursor:pointer; padding:5px; line-height:0; border-radius:8px}
.x:hover{background:var(--surface-2); color:var(--ink)}

.panel-b{
  overflow-y:auto; padding:18px 22px 32px;
  display:grid; grid-template-columns:minmax(0,1fr); gap:26px; align-items:start;
}
.panel.wide .panel-b{grid-template-columns:minmax(0,7fr) minmax(0,6fr); gap:32px}
.pane{display:grid; gap:18px; min-width:0}
.panel-f{border-top:1px solid var(--line); padding:12px 22px; display:flex; gap:8px; align-items:center}

.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; min-width:0}
.f{display:grid; gap:5px; min-width:0}
.f > label, .lb2{
  font-family:var(--mono); font-size:10.5px; text-transform:uppercase;
  letter-spacing:.09em; color:var(--muted);
}
.f input,.f select,.f textarea{
  background:var(--bg); border:1px solid var(--line); border-radius:8px;
  padding:8px 10px; width:100%; max-width:100%; color:var(--ink);
}
.f textarea{resize:vertical; min-height:90px; font-size:13.5px; line-height:1.6}
.hint{font-size:12.5px; color:var(--muted); margin:-8px 0 0}
fieldset{border:0; padding:0; margin:0; display:grid; gap:18px; min-width:0}

.reqs{display:grid; gap:8px; margin:0; padding:0; list-style:none; min-width:0}
.reqs li{
  display:flex; gap:9px; align-items:flex-start; font-size:13.5px; color:var(--ink-2);
  min-width:0; line-height:1.45;
}
.reqs li > input{margin:3px 0 0; accent-color:var(--accent); flex:0 0 auto; width:14px; height:14px}
.reqs li > label{flex:1 1 auto; min-width:0; overflow-wrap:anywhere; cursor:pointer}
.reqs li.no > label{color:var(--crit)}
.hist{display:grid; gap:6px; margin:0; padding:0; list-style:none; font-family:var(--mono); font-size:12px; color:var(--muted)}
.kw{display:flex; flex-wrap:wrap; gap:5px; min-width:0}
.link{color:var(--accent); text-decoration:none; border-bottom:1px solid var(--accent-line); font-size:13.5px; overflow-wrap:anywhere}
.path{font-family:var(--mono); font-size:11.5px; color:var(--muted); overflow-wrap:anywhere}

.jdbox{border:1px solid var(--line); border-radius:var(--r); background:var(--bg); min-width:0; overflow:hidden}
.jdbox > .jdh{
  padding:10px 14px; font-family:var(--mono); font-size:10.5px; text-transform:uppercase;
  letter-spacing:.09em; color:var(--muted); border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:8px;
}
.jdbox > .jdh button{
  margin-left:auto; background:none; border:0; color:var(--accent); cursor:pointer;
  font:inherit; text-transform:none; letter-spacing:0;
}
.jdtext{
  padding:14px; font-size:13px; line-height:1.65; color:var(--ink-2);
  white-space:pre-wrap; overflow-wrap:anywhere; overflow-y:auto; max-height:300px;
}
.jdbox.open .jdtext{max-height:none}
.panel.wide .jdtext{max-height:calc(100vh - 300px)}

.toast{
  position:fixed; left:50%; bottom:22px; transform:translate(-50%,16px); z-index:60;
  background:var(--ink); color:var(--bg); font-size:13px; padding:9px 15px;
  border-radius:999px; box-shadow:var(--shadow-lg); opacity:0; pointer-events:none;
  transition:opacity .18s, transform .18s; max-width:90vw; text-align:center;
}
.toast.on{opacity:1; transform:translate(-50%,0)}

@media (max-width:820px){
  .panel{width:100%; border-left:0}
  .panel.wide .panel-b{grid-template-columns:minmax(0,1fr)}
  .hbtns .icb .lbl{display:none}
}
@media (max-width:640px){
  .top{padding:14px 14px 10px} .bar{padding:10px 14px} .board{padding:14px 14px 40px}
  .pipe{margin-left:0; width:100%}
  .listwrap{padding:14px 14px 40px}
  .panel-b{padding:14px 16px 24px} .panel-h{padding:16px} .panel-f{padding:12px 16px}
}
</style>
</head>
<body>

<header class="top">
  <h1 class="brand">Grad Pipeline <span>· Tsoi Ching Yi</span></h1>
  <nav class="pipe" id="pipe" aria-label="Filter by stage"></nav>
</header>

<div class="bar">
  <div class="search">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
    <input type="search" id="q" placeholder="Search company, role, JD…" aria-label="Search jobs">
  </div>
  <div class="seg" role="group" aria-label="View">
    <button id="vBoard" aria-pressed="true">Board</button>
    <button id="vList" aria-pressed="false">Deadlines</button>
  </div>
  <button class="btn" id="addBtn">Add job</button>
  <button class="btn ghost sm" id="expBtn" title="Copy the whole board as JSON so Claude can sync it into your folder">Copy JSON</button>
  <button class="btn ghost sm" id="impBtn" title="Paste a board JSON to replace what's here">Paste JSON</button>
  <span class="sync" id="sync"></span>
</div>

<main id="view" aria-live="polite"></main>

<div class="scrim" id="scrim"></div>

<aside class="panel" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle" hidden>
  <div class="panel-h">
    <div class="who">
      <h2 id="dTitle"></h2>
      <p id="dSub"></p>
    </div>
    <div class="hbtns">
      <button class="icb" id="dWide" aria-pressed="false">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M6 2H2v4M10 14h4v-4M2 10v4h4M14 6V2h-4"/></svg>
        <span class="lbl" id="dWideLbl">Expand</span>
      </button>
      <button class="x" id="dClose" aria-label="Close"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 4l10 10M14 4L4 14"/></svg></button>
    </div>
  </div>
  <div class="panel-b" id="dBody"></div>
  <div class="panel-f">
    <button class="btn" id="dSave">Save</button>
    <button class="btn ghost" id="dCancel">Close</button>
    <button class="btn danger" id="dDel" style="margin-left:auto">Delete</button>
  </div>
</aside>

<aside class="panel" id="addPanel" role="dialog" aria-modal="true" aria-labelledby="aTitle" hidden>
  <div class="panel-h">
    <div class="who">
      <h2 id="aTitle">Add a job</h2>
      <p>Company, role and deadline are enough to start.</p>
    </div>
    <div class="hbtns">
      <button class="x" id="aClose" aria-label="Close"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 4l10 10M14 4L4 14"/></svg></button>
    </div>
  </div>
  <div class="panel-b"><fieldset id="addForm"></fieldset></div>
  <div class="panel-f">
    <button class="btn" id="aSave">Add job</button>
    <button class="btn ghost" id="aCancel">Cancel</button>
  </div>
</aside>

<div class="toast" id="toast" role="status"></div>

<script>
(function(){
"use strict";

var STORE="gradPipeline.v1";
var STAGES=[
  {id:"interested",label:"Interested"},
  {id:"applied",label:"Applied"},
  {id:"assessment",label:"Assessment"},
  {id:"interview",label:"Interview"},
  {id:"offer",label:"Offer"},
  {id:"closed",label:"Closed"}
];
var stageLabel={}; STAGES.forEach(function(s){stageLabel[s.id]=s.label;});

var seed={version:1,owner:"Tsoi Ching Yi",jobs:[]};
try{
  var sn=document.getElementById("app-state");
  if(sn) seed=Object.assign(seed,JSON.parse(sn.textContent||"{}"));
}catch(e){}
if(!Array.isArray(seed.jobs)) seed.jobs=[];

var state=seed, storageOK=true;
try{
  var raw=localStorage.getItem(STORE);
  if(raw){
    var got=JSON.parse(raw);
    if(got&&Array.isArray(got.jobs)) state=got;
  }
}catch(e){ storageOK=false; }

var ui={view:"board",stage:"all",q:"",open:null,wide:false};

/* ---------- helpers ---------- */
function el(t,c,x){var n=document.createElement(t); if(c)n.className=c; if(x!=null)n.textContent=x; return n;}
function todayISO(){var d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);}
function daysTo(iso){
  if(!iso||!/^\d{4}-\d{2}-\d{2}$/.test(iso)) return null;
  return Math.round((new Date(iso+"T00:00:00")-new Date(todayISO()+"T00:00:00"))/864e5);
}
function urgency(j){
  if(j.status==="closed"||j.status==="offer") return "";
  var d=daysTo(j.deadline);
  if(d===null) return "";
  if(d<=3) return "crit";
  if(d<=10) return "soon";
  return "ok";
}
function deadlineText(j){
  if(!j.deadline) return "";
  if(!/^\d{4}-\d{2}-\d{2}$/.test(j.deadline)) return String(j.deadline);
  var d=daysTo(j.deadline);
  if(d<0) return "closed "+Math.abs(d)+"d ago";
  if(d===0) return "due today";
  if(d===1) return "1 day left";
  return d+" days left";
}
function slug(s){return String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,48);}
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);}
function toast(m){
  var t=document.getElementById("toast"); t.textContent=m; t.classList.add("on");
  clearTimeout(toast._t); toast._t=setTimeout(function(){t.classList.remove("on");},2600);
}
function setSync(s,m){var n=document.getElementById("sync"); n.dataset.s=s||""; n.textContent=m||"";}

function save(){
  state.savedAt=new Date().toISOString();
  if(!storageOK){ setSync("error","not saved — storage blocked"); return; }
  try{
    localStorage.setItem(STORE,JSON.stringify(state));
    setSync("dirty","saved here · copy JSON to sync");
  }catch(e){ storageOK=false; setSync("error","not saved — storage full"); }
}

/* ---------- render ---------- */
function visible(){
  var q=ui.q.trim().toLowerCase();
  return state.jobs.filter(function(j){
    if(ui.stage!=="all"&&j.status!==ui.stage) return false;
    if(!q) return true;
    return [j.company,j.role,j.location,j.jd,j.notes,j.source].join(" ").toLowerCase().indexOf(q)>-1;
  });
}
function byDeadline(a,b){
  var da=daysTo(a.deadline), db=daysTo(b.deadline);
  if(da===null&&db===null) return (a.company||"").localeCompare(b.company||"");
  if(da===null) return 1; if(db===null) return -1;
  return da-db;
}
function renderPipe(){
  var nav=document.getElementById("pipe"); nav.innerHTML="";
  var counts={all:state.jobs.length};
  STAGES.forEach(function(s){counts[s.id]=0;});
  state.jobs.forEach(function(j){ if(counts[j.status]!=null) counts[j.status]++; });
  [{id:"all",label:"All"}].concat(STAGES).forEach(function(s){
    var b=el("button"); b.setAttribute("aria-pressed",ui.stage===s.id?"true":"false");
    b.appendChild(el("b",null,String(counts[s.id]||0)));
    b.appendChild(el("span","lb",s.label));
    b.onclick=function(){ui.stage=s.id; render();};
    nav.appendChild(b);
  });
}
function card(j){
  var b=el("button","card");
  b.dataset.id=j.id; b.dataset.urg=urgency(j); b.draggable=true;
  b.appendChild(el("div","co",j.company||"Untitled"));
  if(j.role) b.appendChild(el("div","ro",j.role));
  var meta=el("div","meta");
  var dl=deadlineText(j);
  if(dl){var c=el("span","chip",dl); var u=urgency(j); if(u==="crit"||u==="soon")c.dataset.u=u; meta.appendChild(c);}
  else meta.appendChild(el("span","chip","no deadline"));
  if(j.location) meta.appendChild(el("span","chip",j.location));
  var fit=el("div","fit");
  for(var i=1;i<=5;i++){var d=el("i"); if(i<=(j.fit||0))d.className="on"; fit.appendChild(d);}
  fit.title="Fit "+(j.fit||0)+"/5";
  meta.appendChild(fit); b.appendChild(meta);
  b.onclick=function(){openDrawer(j.id);};
  b.addEventListener("dragstart",function(e){
    e.dataTransfer.setData("text/plain",j.id); e.dataTransfer.effectAllowed="move";
    b.classList.add("dragging");
  });
  b.addEventListener("dragend",function(){b.classList.remove("dragging");});
  return b;
}
function renderBoard(){
  var jobs=visible(), wrap=el("div","board");
  STAGES.forEach(function(s){
    var mine=jobs.filter(function(j){return j.status===s.id;}).sort(byDeadline);
    var col=el("div","col");
    var h=el("div","col-h"); h.appendChild(el("h2",null,s.label)); h.appendChild(el("span","n",String(mine.length)));
    col.appendChild(h);
    var drop=el("div","drop"); drop.dataset.stage=s.id;
    if(!mine.length) drop.appendChild(el("div","col-empty","—"));
    mine.forEach(function(j){drop.appendChild(card(j));});
    drop.addEventListener("dragover",function(e){e.preventDefault(); drop.classList.add("over");});
    drop.addEventListener("dragleave",function(){drop.classList.remove("over");});
    drop.addEventListener("drop",function(e){
      e.preventDefault(); drop.classList.remove("over");
      moveJob(e.dataTransfer.getData("text/plain"),s.id);
    });
    col.appendChild(drop); wrap.appendChild(col);
  });
  return wrap;
}
function renderList(){
  var jobs=visible().slice().sort(byDeadline), wrap=el("div","listwrap");
  if(!jobs.length){wrap.appendChild(el("p","col-empty","Nothing matches.")); return wrap;}
  var t=el("table");
  t.innerHTML="<thead><tr><th>Company / role</th><th>Stage</th><th>Deadline</th><th>Left</th><th>Fit</th><th>Applied</th></tr></thead>";
  var tb=el("tbody");
  jobs.forEach(function(j){
    var tr=el("tr"); tr.tabIndex=0;
    var c1=el("td"); c1.appendChild(el("div","co",j.company||"Untitled"));
    if(j.role) c1.appendChild(el("div","ro",j.role));
    tr.appendChild(c1);
    var c2=el("td"); var s=el("span","stg",stageLabel[j.status]||j.status); s.dataset.s=j.status; c2.appendChild(s); tr.appendChild(c2);
    tr.appendChild(el("td","num",j.deadline||"—"));
    var c4=el("td","num"); var u=urgency(j);
    var left=el("span","chip",deadlineText(j)||"—"); if(u==="crit"||u==="soon")left.dataset.u=u;
    c4.appendChild(left); tr.appendChild(c4);
    tr.appendChild(el("td","num",(j.fit||0)+"/5"));
    tr.appendChild(el("td","num",j.appliedOn||"—"));
    tr.onclick=function(){openDrawer(j.id);};
    tr.onkeydown=function(e){if(e.key==="Enter")openDrawer(j.id);};
    tb.appendChild(tr);
  });
  t.appendChild(tb); wrap.appendChild(t); return wrap;
}
function renderEmpty(){
  var w=el("div","empty");
  w.innerHTML='<h2>This board is empty on this device</h2>'+
    '<p>Your jobs live in this browser, not on the server \u2014 nothing about your '+
    'search is public. To bring a board over from another device, copy its JSON '+
    'and paste it here.</p>'+
    '<ol><li><b>Paste JSON</b> in the toolbar to load a board Claude gave you, or one '+
    'you copied from your laptop.</li>'+
    '<li><b>Add job</b> to enter one by hand.</li>'+
    '<li>Drag cards across as you hear back. Deadlines turn amber at ten days, red at three.</li>'+
    '<li><b>Copy JSON</b> when you want Claude to sync your changes into your folder.</li></ol>';
  var b=el("button","btn"); b.textContent="Add one manually"; b.style.marginTop="20px"; b.onclick=openAdd;
  w.appendChild(b); return w;
}
function render(){
  renderPipe();
  var v=document.getElementById("view"); v.innerHTML="";
  document.getElementById("vBoard").setAttribute("aria-pressed",ui.view==="board");
  document.getElementById("vList").setAttribute("aria-pressed",ui.view==="list");
  if(!state.jobs.length){ v.appendChild(renderEmpty()); return; }
  v.appendChild(ui.view==="board"?renderBoard():renderList());
}

/* ---------- mutate ---------- */
function find(id){return state.jobs.filter(function(j){return j.id===id;})[0];}
function moveJob(id,stage){
  var j=find(id); if(!j||j.status===stage) return;
  j.status=stage; j.updatedAt=todayISO();
  if(stage==="applied"&&!j.appliedOn) j.appliedOn=todayISO();
  (j.timeline=j.timeline||[]).push({date:todayISO(),stage:stageLabel[stage],note:""});
  render(); save(); toast(j.company+" → "+stageLabel[stage]);
}

/* ---------- fields ---------- */
function field(label,name,value,type,opts){
  var f=el("div","f"), id="f-"+name, input;
  var l=el("label",null,label); l.setAttribute("for",id); f.appendChild(l);
  if(type==="select"){
    input=el("select");
    (opts||[]).forEach(function(o){
      var op=el("option",null,o.label); op.value=o.id; if(o.id===value)op.selected=true; input.appendChild(op);
    });
  } else if(type==="textarea"){
    input=el("textarea"); input.value=value==null?"":value;
    if(opts&&opts.rows) input.rows=opts.rows;
    if(opts&&opts.placeholder) input.placeholder=opts.placeholder;
  } else {
    input=el("input"); input.type=type||"text"; input.value=value==null?"":value;
    if(opts&&opts.placeholder) input.placeholder=opts.placeholder;
    if(type==="number"){input.min=(opts&&opts.min!=null)?opts.min:0; input.max=(opts&&opts.max!=null)?opts.max:5;}
  }
  input.id=id; input.name=name; f.appendChild(input);
  return f;
}

/* ---------- drawer ---------- */
function openDrawer(id){
  var j=find(id); if(!j) return;
  ui.open=id;
  document.getElementById("dTitle").textContent=j.company||"Untitled";
  document.getElementById("dSub").textContent=[j.role,j.location,j.source?"via "+j.source:""].filter(Boolean).join(" · ")||"—";

  var b=document.getElementById("dBody"); b.innerHTML="";
  var main=el("div","pane"), side=el("div","pane");

  var g=el("div","grid2");
  g.appendChild(field("Stage","status",j.status,"select",STAGES));
  g.appendChild(field("Deadline","deadline",j.deadline,"date"));
  g.appendChild(field("Applied on","appliedOn",j.appliedOn,"date"));
  g.appendChild(field("Fit (1–5)","fit",j.fit||0,"number",{min:0,max:5}));
  main.appendChild(g);

  if(j.link){
    var lw=el("div","f"); lw.appendChild(el("div","lb2","Posting"));
    var a=el("a","link",j.link); a.href=j.link; a.target="_blank"; a.rel="noopener noreferrer";
    lw.appendChild(a); main.appendChild(lw);
  }

  if(j.requirements&&j.requirements.length){
    var rw=el("div","f"); rw.appendChild(el("div","lb2","What they're asking for"));
    var ul=el("ul","reqs");
    j.requirements.forEach(function(r,i){
      var txt=(r&&r.text)!=null?r.text:String(r);
      var li=el("li"); if(!r.met) li.className="no";
      var cb=el("input"); cb.type="checkbox"; cb.checked=!!r.met; cb.id="req-"+i;
      cb.onchange=function(){ r.met=cb.checked; li.className=cb.checked?"":"no"; save(); };
      var lab=el("label",null,txt); lab.setAttribute("for","req-"+i);
      li.appendChild(cb); li.appendChild(lab); ul.appendChild(li);
    });
    rw.appendChild(ul); main.appendChild(rw);
  }

  if(j.keywords&&j.keywords.length){
    var kw=el("div","f"); kw.appendChild(el("div","lb2","Keywords to mirror"));
    var box=el("div","kw");
    j.keywords.forEach(function(k){box.appendChild(el("span","chip",k));});
    kw.appendChild(box); main.appendChild(kw);
  }

  main.appendChild(field("My notes","notes",j.notes,"textarea",{rows:5,placeholder:"What I need to remember about this one."}));

  var fw=el("div","f"); fw.appendChild(el("div","lb2","Files on disk"));
  fw.appendChild(el("div","path","01_Jobs/"+(j.file||slug(j.company)+"-"+slug(j.role)+".md")));
  if(j.cv) fw.appendChild(el("div","path",j.cv));
  main.appendChild(fw);

  if(j.jd){
    var box2=el("div","jdbox");
    var h=el("div","jdh"); h.appendChild(el("span",null,"Full job description"));
    var tog=el("button",null,"Show all"); h.appendChild(tog);
    var txt=el("div","jdtext",j.jd);
    tog.onclick=function(){
      var open=box2.classList.toggle("open");
      tog.textContent=open?"Collapse":"Show all";
    };
    box2.appendChild(h); box2.appendChild(txt);
    side.appendChild(box2);
  }

  if(j.timeline&&j.timeline.length){
    var tw=el("div","f"); tw.appendChild(el("div","lb2","History"));
    var tl=el("ul","hist");
    j.timeline.slice().reverse().forEach(function(t){
      tl.appendChild(el("li",null,t.date+"  ·  "+t.stage+(t.note?"  ·  "+t.note:"")));
    });
    tw.appendChild(tl); side.appendChild(tw);
  }

  b.appendChild(main);
  if(side.childNodes.length) b.appendChild(side);
  show("drawer");
}

function setWide(on){
  ui.wide=on;
  var p=document.getElementById("drawer");
  p.classList.toggle("wide",on);
  var btn=document.getElementById("dWide");
  btn.setAttribute("aria-pressed",on?"true":"false");
  document.getElementById("dWideLbl").textContent=on?"Shrink":"Expand";
  var box=p.querySelector(".jdbox");
  if(box&&on) box.classList.add("open");
}

function saveDrawer(){
  var j=find(ui.open); if(!j){close();return;}
  var b=document.getElementById("dBody");
  function val(n){var e=b.querySelector('[name="'+n+'"]'); return e?e.value:undefined;}
  var ns=val("status");
  if(ns&&ns!==j.status){
    j.status=ns;
    (j.timeline=j.timeline||[]).push({date:todayISO(),stage:stageLabel[ns],note:""});
    if(ns==="applied"&&!j.appliedOn) j.appliedOn=todayISO();
  }
  j.deadline=val("deadline")||"";
  var ao=val("appliedOn"); if(ao!==undefined) j.appliedOn=ao;
  j.fit=Math.max(0,Math.min(5,parseInt(val("fit"),10)||0));
  j.notes=val("notes")||"";
  j.updatedAt=todayISO();
  close(); render(); save(); toast("Saved "+(j.company||"job"));
}
function delJob(){
  var j=find(ui.open); if(!j) return;
  state.jobs=state.jobs.filter(function(x){return x.id!==ui.open;});
  close(); render(); save(); toast("Removed "+(j.company||"job"));
}

/* ---------- add ---------- */
var ADD=[
  ["Company","company","text",{placeholder:"e.g. Procter & Gamble"}],
  ["Role","role","text",{placeholder:"Brand Manager (Management Trainee)"}],
  ["Location","location","text",{placeholder:"Hong Kong"}],
  ["Deadline","deadline","date",{}],
  ["Fit (1–5)","fit","number",{min:0,max:5}],
  ["Stage","status","select",null],
  ["Posting link","link","url",{placeholder:"https://…"}],
  ["Where I found it","source","text",{placeholder:"HKUST Career Centre"}]
];
function openAdd(){
  var f=document.getElementById("addForm"); f.innerHTML="";
  var g=el("div","grid2");
  ADD.forEach(function(a){
    g.appendChild(a[2]==="select"
      ? field(a[0],a[1],"interested","select",STAGES)
      : field(a[0],a[1],a[1]==="fit"?3:"",a[2],a[3]));
  });
  f.appendChild(g);
  f.appendChild(field("Paste the job description","jd","","textarea",{rows:10}));
  f.appendChild(el("p","hint","Verbatim beats summarised — the exact wording is what the CV gets tailored against."));
  show("addPanel");
}
function saveAdd(){
  var f=document.getElementById("addForm");
  function val(n){var e=f.querySelector('[name="'+n+'"]'); return e?e.value.trim():"";}
  var company=val("company");
  if(!company){ toast("A company name at least."); var c=f.querySelector('[name="company"]'); if(c)c.focus(); return; }
  var role=val("role");
  var j={
    id:uid(), company:company, role:role, location:val("location"),
    deadline:val("deadline"), fit:Math.max(0,Math.min(5,parseInt(val("fit"),10)||0)),
    status:val("status")||"interested", link:val("link"), source:val("source"),
    jd:val("jd"), notes:"", requirements:[], keywords:[],
    file:slug(company)+(role?"-"+slug(role):"")+".md",
    timeline:[{date:todayISO(),stage:"Added",note:""}],
    createdAt:todayISO(), updatedAt:todayISO()
  };
  if(j.status==="applied") j.appliedOn=todayISO();
  state.jobs.push(j);
  close(); render(); save(); toast("Added "+company);
}

/* ---------- panels ---------- */
var openPanel=null;
function show(id){
  var p=document.getElementById(id); p.hidden=false;
  requestAnimationFrame(function(){p.classList.add("on");});
  document.getElementById("scrim").classList.add("on");
  openPanel=id;
}
function close(){
  if(!openPanel) return;
  var p=document.getElementById(openPanel); p.classList.remove("on");
  document.getElementById("scrim").classList.remove("on");
  setTimeout(function(){p.hidden=true;},220);
  openPanel=null; ui.open=null;
}

/* ---------- sync helpers ---------- */
function copyJSON(){
  var txt=JSON.stringify(state,null,1);
  function fallback(){
    var ta=el("textarea"); ta.value=txt;
    ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand("copy"); toast("Board JSON copied — paste it to Claude."); }
    catch(e){ toast("Couldn't copy. Select the text and copy it yourself."); ta.style.opacity="1"; return; }
    document.body.removeChild(ta);
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){
      toast("Board JSON copied — paste it to Claude.");
    }).catch(fallback);
  } else fallback();
}
function pasteJSON(){
  var txt=window.prompt("Paste a board JSON to replace what's here:");
  if(!txt) return;
  try{
    var got=JSON.parse(txt);
    if(!got||!Array.isArray(got.jobs)) throw 0;
    state=got; render(); save(); toast("Board replaced — "+got.jobs.length+" job(s).");
  }catch(e){ toast("That isn't a board JSON. Nothing changed."); }
}

/* ---------- wiring ---------- */
document.getElementById("q").addEventListener("input",function(e){ui.q=e.target.value; render();});
document.getElementById("vBoard").onclick=function(){ui.view="board"; render();};
document.getElementById("vList").onclick=function(){ui.view="list"; render();};
document.getElementById("addBtn").onclick=openAdd;
document.getElementById("expBtn").onclick=copyJSON;
document.getElementById("impBtn").onclick=pasteJSON;
document.getElementById("dSave").onclick=saveDrawer;
document.getElementById("dCancel").onclick=close;
document.getElementById("dClose").onclick=close;
document.getElementById("dDel").onclick=delJob;
document.getElementById("dWide").onclick=function(){setWide(!ui.wide);};
document.getElementById("aSave").onclick=saveAdd;
document.getElementById("aCancel").onclick=close;
document.getElementById("aClose").onclick=close;
document.getElementById("scrim").onclick=close;
document.addEventListener("keydown",function(e){
  var typing=/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if(e.key==="Escape") close();
  if(!openPanel&&!typing&&(e.key==="n"||e.key==="N")){ e.preventDefault(); openAdd(); }
  if(openPanel==="drawer"&&!typing&&(e.key==="e"||e.key==="E")){ e.preventDefault(); setWide(!ui.wide); }
});

render();
setSync("", storageOK ? "" : "storage blocked — changes won't stick");
})();
</script>
