<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grad Pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root{
  --bg:#F6F8F5; --surface:#FFFFFF; --surface-2:#EFF3EE; --surface-3:#E6ECE7;
  --ink:#131B16; --ink-2:#3D4A43; --muted:#5A6960;
  --line:#DCE4DD; --line-strong:#C0CCC4;
  --accent:#1E5C42; --accent-ink:#FFFFFF; --accent-soft:#E1EDE6; --accent-line:#A9CDB9;
  --warn:#8A5A00; --warn-soft:#FAF0DA;
  --crit:#A32219; --crit-soft:#FAE6E3;
  --shadow:0 1px 2px rgba(19,27,22,.06), 0 8px 24px -12px rgba(19,27,22,.18);
  --shadow-lg:0 24px 60px -20px rgba(19,27,22,.35);
  --r:10px;
  --sans:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --disp:"Bricolage Grotesque","Public Sans",-apple-system,Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1411; --surface:#161D18; --surface-2:#1C241E; --surface-3:#222B25;
    --ink:#E7EEE9; --ink-2:#BCC8C0; --muted:#8B9A91;
    --line:#263029; --line-strong:#3A473E;
    --accent:#6DC79A; --accent-ink:#0F1411; --accent-soft:#172C21; --accent-line:#2E4C3B;
    --warn:#E2AC48; --warn-soft:#2A2213;
    --crit:#F2867B; --crit-soft:#2E1A18;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    --shadow-lg:0 24px 60px -20px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1411; --surface:#161D18; --surface-2:#1C241E; --surface-3:#222B25;
  --ink:#E7EEE9; --ink-2:#BCC8C0; --muted:#8B9A91;
  --line:#263029; --line-strong:#3A473E;
  --accent:#6DC79A; --accent-ink:#0F1411; --accent-soft:#172C21; --accent-line:#2E4C3B;
  --warn:#E2AC48; --warn-soft:#2A2213;
  --crit:#F2867B; --crit-soft:#2E1A18;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lg:0 24px 60px -20px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
html,body{margin:0; padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
[hidden]{display:none!important}

.btn{
  background:var(--accent); color:var(--accent-ink); border:1px solid transparent;
  border-radius:var(--r); padding:8px 15px; font-weight:600; font-size:13.5px;
  cursor:pointer; white-space:nowrap;
}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn.ghost{background:var(--surface); color:var(--ink); border-color:var(--line-strong); font-weight:500}
.btn.ghost:hover:not(:disabled){background:var(--surface-2); filter:none}
.btn.danger{background:none; color:var(--crit); border-color:var(--line-strong); font-weight:500}
.btn.sm{padding:6px 11px; font-size:12.5px}
.btn:disabled{opacity:.5; cursor:not-allowed; filter:none}
.btn.wide{width:100%; padding:10px; justify-content:center}
.linkbtn{background:none; border:0; color:var(--accent); cursor:pointer; font:inherit; text-decoration:underline; padding:0}

/* ================= gate (setup / auth / loading) ================= */
.gate{min-height:100vh; display:grid; place-items:center; padding:28px 20px}
.gatecard{
  width:100%; max-width:420px; background:var(--surface); border:1px solid var(--line);
  border-radius:14px; box-shadow:var(--shadow); padding:30px 28px;
}
.gatecard.wide{max-width:640px}
.mark{
  font-family:var(--disp); font-weight:700; font-size:24px; letter-spacing:-.025em;
  margin:0 0 5px; display:flex; align-items:center; gap:9px;
}
.mark svg{width:22px; height:22px; color:var(--accent); flex:0 0 auto}
.gatecard > p.sub{margin:0 0 22px; color:var(--muted); font-size:13.5px}
.gatecard h2{font-family:var(--disp); font-size:17px; font-weight:700; margin:0 0 14px; letter-spacing:-.015em}
.gform{display:grid; gap:14px}
.field{display:grid; gap:5px}
.field > label{
  font-family:var(--mono); font-size:10.5px; text-transform:uppercase;
  letter-spacing:.09em; color:var(--muted);
}
.field input, .field select, .field textarea{
  background:var(--bg); border:1px solid var(--line); border-radius:8px;
  padding:9px 11px; width:100%; max-width:100%; color:var(--ink);
}
.field textarea{resize:vertical; min-height:90px; font-size:13.5px; line-height:1.6}
.swap{margin:16px 0 0; font-size:13px; color:var(--muted); text-align:center}
.note{
  font-size:13px; line-height:1.55; padding:11px 13px; border-radius:9px; margin:0;
  background:var(--surface-2); color:var(--ink-2); border:1px solid var(--line);
}
.note.bad{background:var(--crit-soft); color:var(--crit); border-color:transparent}
.note.good{background:var(--accent-soft); color:var(--accent); border-color:transparent}
.note.warn{background:var(--warn-soft); color:var(--warn); border-color:transparent}
.steps{margin:0; padding-left:22px; color:var(--ink-2); font-size:13.5px; line-height:1.65}
.steps li{margin-bottom:9px}
.steps code, code.inline{
  font-family:var(--mono); font-size:12px; background:var(--surface-2);
  padding:1px 5px; border-radius:4px; overflow-wrap:anywhere;
}
.spin{
  width:20px; height:20px; border:2px solid var(--line-strong); border-top-color:var(--accent);
  border-radius:50%; animation:sp .7s linear infinite; margin:0 auto;
}
@keyframes sp{to{transform:rotate(360deg)}}

/* ================= app chrome ================= */
.top{
  position:sticky; top:0; z-index:30; background:var(--bg);
  border-bottom:1px solid var(--line);
  display:flex; flex-wrap:wrap; align-items:center; gap:8px 18px;
  padding:14px 20px 12px;
}
.brand{
  font-family:var(--disp); font-weight:700; font-size:18px; letter-spacing:-.02em;
  margin:0; display:flex; align-items:center; gap:8px;
}
.brand svg{width:17px; height:17px; color:var(--accent)}
.who{
  margin-left:auto; display:flex; align-items:center; gap:10px;
  font-family:var(--mono); font-size:11px; color:var(--muted);
}
.who .em{overflow-wrap:anywhere; max-width:200px}

.pipe{display:flex; flex-wrap:wrap; gap:4px; padding:10px 20px 0; font-family:var(--mono); font-size:11.5px}
.pipe button{
  display:flex; align-items:center; gap:6px; background:none; border:1px solid transparent;
  border-radius:999px; padding:4px 9px; cursor:pointer; color:var(--muted);
  transition:background .12s, color .12s;
}
.pipe button:hover{background:var(--surface-2); color:var(--ink-2)}
.pipe button[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent-line); color:var(--ink)}
.pipe b{font-family:var(--sans); font-weight:600; font-size:13px; font-variant-numeric:tabular-nums; color:var(--ink)}
.pipe .lb{text-transform:uppercase; letter-spacing:.07em}

.bar{display:flex; flex-wrap:wrap; gap:9px; align-items:center; padding:12px 20px; border-bottom:1px solid var(--line)}
.search{flex:1 1 180px; max-width:320px; position:relative; display:flex; align-items:center}
.search input{
  width:100%; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:8px 11px 8px 31px; color:var(--ink);
}
.search svg{position:absolute; left:10px; width:14px; height:14px; color:var(--muted); pointer-events:none}
.seg{display:flex; background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r); padding:2px}
.seg button{background:none; border:0; border-radius:7px; padding:5px 12px; cursor:pointer; font-size:13px; font-weight:500; color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:var(--shadow)}
.state{font-family:var(--mono); font-size:11px; color:var(--muted); margin-left:auto; white-space:nowrap}
.state[data-s="busy"]{color:var(--warn)}
.state[data-s="bad"]{color:var(--crit)}

/* ================= board ================= */
.board{display:flex; gap:12px; padding:16px 20px 40px; overflow-x:auto; align-items:flex-start}
.col{flex:0 0 252px; display:flex; flex-direction:column; gap:8px}
.col-h{display:flex; align-items:center; gap:7px; padding:0 2px 2px}
.col-h h2{margin:0; font-family:var(--mono); font-size:11px; font-weight:500; text-transform:uppercase; letter-spacing:.09em; color:var(--muted)}
.col-h .n{font-family:var(--mono); font-size:11px; color:var(--muted); margin-left:auto}
.drop{display:flex; flex-direction:column; gap:8px; min-height:64px; border-radius:var(--r); border:1px dashed transparent; padding:2px; transition:border-color .12s, background .12s}
.drop.over{border-color:var(--accent-line); background:var(--accent-soft)}
.col-empty{font-size:12.5px; color:var(--muted); padding:10px 4px; font-style:italic}

.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:10px 11px 9px; cursor:pointer; text-align:left; width:100%;
  display:grid; gap:5px; box-shadow:var(--shadow); border-left:3px solid var(--line-strong);
  transition:transform .1s, border-color .12s;
}
.card:hover{border-color:var(--line-strong); transform:translateY(-1px)}
.card.dragging{opacity:.4}
.card[data-urg="crit"]{border-left-color:var(--crit)}
.card[data-urg="soon"]{border-left-color:var(--warn)}
.card[data-urg="ok"]{border-left-color:var(--accent)}
.card .co{font-family:var(--disp); font-weight:700; font-size:14.5px; letter-spacing:-.01em; line-height:1.25; overflow-wrap:anywhere}
.card .ro{font-size:12.5px; color:var(--ink-2); line-height:1.35; overflow-wrap:anywhere}
.card .meta{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:1px}
.chip{font-family:var(--mono); font-size:10.5px; padding:2px 6px; border-radius:5px; background:var(--surface-2); color:var(--muted); white-space:nowrap}
.chip[data-u="crit"]{background:var(--crit-soft); color:var(--crit)}
.chip[data-u="soon"]{background:var(--warn-soft); color:var(--warn)}
.fit{display:flex; gap:2px; margin-left:auto}
.fit i{width:4px; height:4px; border-radius:50%; background:var(--line-strong)}
.fit i.on{background:var(--accent)}

/* ================= list ================= */
.listwrap{padding:16px 20px 40px; overflow-x:auto}
table{border-collapse:collapse; width:100%; min-width:720px; font-size:13.5px}
th{text-align:left; font-family:var(--mono); font-size:10.5px; font-weight:500; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); padding:0 12px 8px; border-bottom:1px solid var(--line); white-space:nowrap}
td{padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
td .co{font-family:var(--disp); font-weight:700; font-size:14px}
td .ro{font-size:12.5px; color:var(--muted)}
td.num{font-family:var(--mono); font-size:12px; font-variant-numeric:tabular-nums; white-space:nowrap}
.stg{display:inline-block; font-family:var(--mono); font-size:10.5px; padding:2px 7px; border-radius:5px; background:var(--surface-2); color:var(--ink-2); white-space:nowrap}
.stg[data-s="offer"]{background:var(--accent-soft); color:var(--accent)}
.stg[data-s="closed"]{color:var(--muted)}

/* ================= empty ================= */
.empty{max-width:560px; margin:60px auto; padding:0 24px; text-align:center}
.empty h2{font-family:var(--disp); font-size:21px; font-weight:700; letter-spacing:-.02em; margin:0 0 10px; text-wrap:balance}
.empty p{color:var(--ink-2); margin:0 auto 22px; max-width:46ch}

/* ================= panels ================= */
.scrim{position:fixed; inset:0; background:rgba(10,16,12,.42); z-index:40; opacity:0; pointer-events:none; transition:opacity .18s}
.scrim.on{opacity:1; pointer-events:auto}
.panel{
  position:fixed; top:0; right:0; bottom:0; z-index:50; width:min(760px,100%);
  background:var(--surface); border-left:1px solid var(--line); box-shadow:var(--shadow-lg);
  transform:translateX(100%); transition:transform .22s cubic-bezier(.32,.72,0,1), width .22s ease;
  display:flex; flex-direction:column;
}
.panel.on{transform:none}
.panel.wide{width:100%; border-left:0}
.panel-h{display:flex; align-items:flex-start; gap:12px; padding:18px 22px 14px; border-bottom:1px solid var(--line)}
.panel-h .idt{min-width:0; flex:1 1 auto}
.panel-h h2{font-family:var(--disp); font-size:21px; font-weight:700; letter-spacing:-.02em; margin:0 0 2px; line-height:1.2; overflow-wrap:anywhere}
.panel-h p{margin:0; color:var(--ink-2); font-size:13.5px; overflow-wrap:anywhere}
.hbtns{display:flex; align-items:center; gap:6px; flex:0 0 auto}
.icb{background:none; border:1px solid var(--line-strong); color:var(--muted); cursor:pointer; padding:5px 9px; border-radius:8px; display:flex; align-items:center; gap:6px; font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.07em}
.icb:hover{background:var(--surface-2); color:var(--ink)}
.icb svg{width:13px; height:13px}
.x{background:none; border:0; color:var(--muted); cursor:pointer; padding:5px; line-height:0; border-radius:8px}
.x:hover{background:var(--surface-2); color:var(--ink)}
.panel-b{overflow-y:auto; padding:18px 22px 32px; display:grid; grid-template-columns:minmax(0,1fr); gap:26px; align-items:start}
.panel.wide .panel-b{grid-template-columns:minmax(0,7fr) minmax(0,6fr); gap:32px}
.pane{display:grid; gap:18px; min-width:0}
.panel-f{border-top:1px solid var(--line); padding:12px 22px; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; min-width:0}
fieldset{border:0; padding:0; margin:0; display:grid; gap:16px; min-width:0}
.lb2{font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.09em; color:var(--muted)}
.hint{font-size:12.5px; color:var(--muted); margin:-8px 0 0}

.reqs{display:grid; gap:8px; margin:0; padding:0; list-style:none; min-width:0}
.reqs li{display:flex; gap:9px; align-items:flex-start; font-size:13.5px; color:var(--ink-2); min-width:0; line-height:1.45}
.reqs li > input{margin:3px 0 0; accent-color:var(--accent); flex:0 0 auto; width:14px; height:14px}
.reqs li > label{
  flex:1 1 auto; min-width:0; overflow-wrap:anywhere; cursor:pointer;
  font-family:var(--sans); font-size:13.5px; text-transform:none;
  letter-spacing:normal; color:inherit;
}
.reqs li.no > label{color:var(--crit)}
.hist{display:grid; gap:6px; margin:0; padding:0; list-style:none; font-family:var(--mono); font-size:12px; color:var(--muted)}
.kw{display:flex; flex-wrap:wrap; gap:5px; min-width:0}
.link{color:var(--accent); text-decoration:none; border-bottom:1px solid var(--accent-line); font-size:13.5px; overflow-wrap:anywhere}
.jdbox{border:1px solid var(--line); border-radius:var(--r); background:var(--bg); min-width:0; overflow:hidden}
.jdbox .jdh{padding:10px 14px; font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px}
.jdbox .jdh button{margin-left:auto; background:none; border:0; color:var(--accent); cursor:pointer; font:inherit; text-transform:none; letter-spacing:0}
.jdtext{padding:14px; font-size:13px; line-height:1.65; color:var(--ink-2); white-space:pre-wrap; overflow-wrap:anywhere; overflow-y:auto; max-height:300px}
.jdbox.open .jdtext{max-height:none}
.panel.wide .jdtext{max-height:calc(100vh - 300px)}

.toast{position:fixed; left:50%; bottom:22px; transform:translate(-50%,16px); z-index:60; background:var(--ink); color:var(--bg); font-size:13px; padding:9px 15px; border-radius:999px; box-shadow:var(--shadow-lg); opacity:0; pointer-events:none; transition:opacity .18s, transform .18s; max-width:90vw; text-align:center}
.toast.on{opacity:1; transform:translate(-50%,0)}

@media (max-width:820px){
  .panel{width:100%; border-left:0}
  .panel.wide .panel-b{grid-template-columns:minmax(0,1fr)}
  .hbtns .icb .lbl{display:none}
}
@media (max-width:640px){
  .top,.bar{padding-left:14px; padding-right:14px}
  .pipe{padding-left:14px; padding-right:14px}
  .board,.listwrap{padding-left:14px; padding-right:14px}
  .panel-b{padding:14px 16px 24px} .panel-h,.panel-f{padding-left:16px; padding-right:16px}
  .gatecard{padding:24px 20px}
}
</style>
</head>
<body>

<!-- ============ gate ============ -->
<div class="gate" id="gate">
  <div class="gatecard" id="gateCard">
    <div class="spin"></div>
  </div>
</div>

<!-- ============ app ============ -->
<div id="app" hidden>
  <header class="top">
    <h1 class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M3 7h5l2 3h11M3 7v12h18V10"/><path d="M3 7V5h6l2 2"/>
      </svg>
      Grad Pipeline
    </h1>
    <div class="who">
      <span class="em" id="whoEmail"></span>
      <button class="btn ghost sm" id="signOut">Sign out</button>
    </div>
  </header>

  <nav class="pipe" id="pipe" aria-label="Filter by stage"></nav>

  <div class="bar">
    <div class="search">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
      <input type="search" id="q" placeholder="Search company, role, JD…" aria-label="Search applications">
    </div>
    <div class="seg" role="group" aria-label="View">
      <button id="vBoard" aria-pressed="true">Board</button>
      <button id="vList" aria-pressed="false">Deadlines</button>
    </div>
    <button class="btn" id="addBtn">Add job</button>
    <button class="btn ghost sm" id="csvBtn" title="Download every application with its full job description">Export CSV</button>
    <button class="btn ghost sm" id="aiBtn" title="Copy a ready-made prompt with all your JDs, to paste into Claude or ChatGPT">Copy for AI</button>
    <span class="state" id="state"></span>
  </div>

  <main id="view" aria-live="polite"></main>
</div>

<div class="scrim" id="scrim"></div>

<!-- job detail -->
<aside class="panel" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle" hidden>
  <div class="panel-h">
    <div class="idt"><h2 id="dTitle"></h2><p id="dSub"></p></div>
    <div class="hbtns">
      <button class="icb" id="dWide" aria-pressed="false">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M6 2H2v4M10 14h4v-4M2 10v4h4M14 6V2h-4"/></svg>
        <span class="lbl" id="dWideLbl">Expand</span>
      </button>
      <button class="x" id="dClose" aria-label="Close"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 4l10 10M14 4L4 14"/></svg></button>
    </div>
  </div>
  <div class="panel-b" id="dBody"></div>
  <div class="panel-f">
    <button class="btn" id="dSave">Save</button>
    <button class="btn ghost" id="dCancel">Close</button>
    <button class="btn danger" id="dDel" style="margin-left:auto">Delete</button>
  </div>
</aside>

<!-- add job -->
<aside class="panel" id="addPanel" role="dialog" aria-modal="true" aria-labelledby="aTitle" hidden>
  <div class="panel-h">
    <div class="idt"><h2 id="aTitle">Add a job</h2><p>Company is the only thing required. Paste the JD if you have it.</p></div>
    <div class="hbtns">
      <button class="x" id="aClose" aria-label="Close"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 4l10 10M14 4L4 14"/></svg></button>
    </div>
  </div>
  <div class="panel-b"><fieldset id="addForm"></fieldset></div>
  <div class="panel-f">
    <button class="btn" id="aSave">Add job</button>
    <button class="btn ghost" id="aCancel">Cancel</button>
  </div>
</aside>

<div class="toast" id="toast" role="status"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
"use strict";

/* =========================================================
   constants
   ========================================================= */
var STAGES=[
  {id:"interested",label:"Interested"},
  {id:"applied",label:"Applied"},
  {id:"assessment",label:"Assessment"},
  {id:"interview",label:"Interview"},
  {id:"offer",label:"Offer"},
  {id:"closed",label:"Closed"}
];
var stageLabel={}; STAGES.forEach(function(s){stageLabel[s.id]=s.label;});

var LOGO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 7h5l2 3h11M3 7v12h18V10"/><path d="M3 7V5h6l2 2"/></svg>';

var sb=null, user=null, jobs=[];

/* =========================================================
   tiny helpers
   ========================================================= */
function $(id){return document.getElementById(id);}
function el(t,c,x){var n=document.createElement(t); if(c)n.className=c; if(x!=null)n.textContent=x; return n;}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
function todayISO(){var d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);}
function daysTo(iso){
  if(!iso||!/^\d{4}-\d{2}-\d{2}$/.test(iso)) return null;
  return Math.round((new Date(iso+"T00:00:00")-new Date(todayISO()+"T00:00:00"))/864e5);
}
function urgency(j){
  if(j.status==="closed"||j.status==="offer") return "";
  var d=daysTo(j.deadline);
  if(d===null) return "";
  if(d<=3) return "crit";
  if(d<=10) return "soon";
  return "ok";
}
function deadlineText(j){
  if(!j.deadline) return "";
  var d=daysTo(j.deadline);
  if(d===null) return String(j.deadline);
  if(d<0) return "closed "+Math.abs(d)+"d ago";
  if(d===0) return "due today";
  if(d===1) return "1 day left";
  return d+" days left";
}
function toast(m){
  var t=$("toast"); t.textContent=m; t.classList.add("on");
  clearTimeout(toast._t); toast._t=setTimeout(function(){t.classList.remove("on");},2800);
}
function setState(s,m){var n=$("state"); n.dataset.s=s||""; n.textContent=m||"";}
function byDeadline(a,b){
  var da=daysTo(a.deadline), db=daysTo(b.deadline);
  if(da===null&&db===null) return (a.company||"").localeCompare(b.company||"");
  if(da===null) return 1; if(db===null) return -1;
  return da-db;
}

function authScreen(mode,msg,msgKind){
  $("gateCard").className="gatecard";
  var isUp = mode==="signup";
  gate(
    head(isUp ? "Track every application in one place."
              : "Welcome back.")+
    (msg?'<p class="note '+(msgKind||"")+'" style="margin-bottom:16px">'+esc(msg)+'</p>':'')+
    '<h2>'+(isUp?"Create an account":"Sign in")+'</h2>'+
    '<form class="gform" id="authForm" novalidate>'+
      '<div class="field"><label for="aEmail">Email</label>'+
        '<input id="aEmail" type="email" autocomplete="email" required></div>'+
      '<div class="field"><label for="aPass">Password</label>'+
        '<input id="aPass" type="password" autocomplete="'+(isUp?"new-password":"current-password")+'" required '+
        (isUp?'minlength="8" ':'')+'></div>'+
      (isUp?'<p class="hint" style="margin:0">At least 8 characters.</p>':'')+
      '<button class="btn wide" type="submit" id="aGo">'+(isUp?"Create account":"Sign in")+'</button>'+
    '</form>'+
    '<p class="swap">'+
      (isUp ? 'Already have an account? <button class="linkbtn" id="toIn">Sign in</button>'
            : 'New here? <button class="linkbtn" id="toUp">Create an account</button>'+
              '<br><button class="linkbtn" id="toReset" style="margin-top:8px">Forgot your password?</button>')+
    '</p>'
  );

  $("authForm").addEventListener("submit",function(e){
    e.preventDefault();
    var email=$("aEmail").value.trim(), pass=$("aPass").value;
    if(!email||!pass) return;
    if(isUp && pass.length<8){ authScreen("signup","Password needs to be at least 8 characters.","bad"); return; }
    $("aGo").disabled=true; $("aGo").textContent=isUp?"Creating…":"Signing in…";
    (isUp ? sb.auth.signUp({email:email,password:pass})
          : sb.auth.signInWithPassword({email:email,password:pass}))
      .then(function(r){
        if(r.error) throw r.error;
        if(isUp && r.data && r.data.user && !r.data.session){
          authScreen("signin","Account created. Check your email for a confirmation link, then sign in.","good");
        }
        // signed-in case is handled by onAuthStateChange
      })
      .catch(function(err){
        authScreen(mode, friendly(err), "bad");
      });
  });
  if($("toIn")) $("toIn").onclick=function(){authScreen("signin");};
  if($("toUp")) $("toUp").onclick=function(){authScreen("signup");};
  if($("toReset")) $("toReset").onclick=resetScreen;
}

function friendly(err){
  var m=(err&&err.message)||"Something went wrong.";
  if(/invalid login credentials/i.test(m)) return "That email and password don't match an account.";
  if(/already registered|already been registered/i.test(m)) return "There's already an account with that email. Try signing in.";
  if(/email not confirmed/i.test(m)) return "Confirm your email first — check your inbox for the link.";
  if(/rate limit|too many/i.test(m)) return "Too many attempts. Wait a minute and try again.";
  if(/failed to fetch|networkerror/i.test(m)) return "Can't reach the server. Check your connection.";
  return m;
}

/* =========================================================
   data layer
   ========================================================= */
function fromRow(r){
  return {
    id:r.id, company:r.company||"", role:r.role||"", location:r.location||"",
    source:r.source||"", link:r.link||"", status:r.status||"interested",
    deadline:r.deadline||"", appliedOn:r.applied_on||"", fit:r.fit||0,
    jd:r.jd||"", notes:r.notes||"",
    requirements:Array.isArray(r.requirements)?r.requirements:[],
    keywords:Array.isArray(r.keywords)?r.keywords:[],
    timeline:Array.isArray(r.timeline)?r.timeline:[],
    createdAt:r.created_at, updatedAt:r.updated_at
  };
}
function toRow(j){
  return {
    company:j.company, role:j.role||null, location:j.location||null,
    source:j.source||null, link:j.link||null, status:j.status,
    deadline:j.deadline||null, applied_on:j.appliedOn||null, fit:j.fit||0,
    jd:j.jd||null, notes:j.notes||null,
    requirements:j.requirements||[], keywords:j.keywords||[], timeline:j.timeline||[]
  };
}

function loadJobs(){
  setState("busy","loading…");
  return sb.from("jobs").select("*").order("deadline",{ascending:true,nullsFirst:false})
    .then(function(r){
      if(r.error) throw r.error;
      jobs=(r.data||[]).map(fromRow);
      setState("","");
      render();
    })
    .catch(function(err){
      setState("bad","couldn't load");
      showLoadError(err);
    });
}

function showLoadError(err){
  var v=$("view"); v.innerHTML="";
  var w=el("div","empty");
  var m=(err&&err.message)||"Unknown error";
  w.appendChild(el("h2",null,"Couldn't load your applications"));
  var p=el("p",null,m); w.appendChild(p);
  if(/relation .*jobs.* does not exist|schema cache/i.test(m)){
    var n=el("p","note warn","The database table doesn't exist yet. Open Supabase → SQL Editor and run the contents of schema.sql, then reload.");
    n.style.textAlign="left"; w.appendChild(n);
  }
  var b=el("button","btn","Try again"); b.onclick=loadJobs; w.appendChild(b);
  v.appendChild(w);
}

function saveJob(j){
  var idx=jobs.findIndex(function(x){return x.id===j.id;});
  setState("busy","saving…");
  return sb.from("jobs").update(toRow(j)).eq("id",j.id).select().single()
    .then(function(r){
      if(r.error) throw r.error;
      if(idx>-1) jobs[idx]=fromRow(r.data);
      setState("","saved");
      setTimeout(function(){ if($("state").textContent==="saved") setState("",""); },1800);
      render();
    })
    .catch(function(err){
      setState("bad","not saved");
      toast("Couldn't save: "+((err&&err.message)||"unknown error"));
      return loadJobs();
    });
}

function addJob(j){
  var row=toRow(j); row.user_id=user.id;
  setState("busy","saving…");
  return sb.from("jobs").insert(row).select().single()
    .then(function(r){
      if(r.error) throw r.error;
      jobs.push(fromRow(r.data));
      setState("","");
      render(); toast("Added "+j.company);
    })
    .catch(function(err){
      setState("bad","not saved");
      toast("Couldn't add: "+((err&&err.message)||"unknown error"));
    });
}

function removeJob(id){
  var j=jobs.find(function(x){return x.id===id;});
  setState("busy","deleting…");
  return sb.from("jobs").delete().eq("id",id)
    .then(function(r){
      if(r.error) throw r.error;
      jobs=jobs.filter(function(x){return x.id!==id;});
      setState("","");
      render(); toast("Removed "+((j&&j.company)||"job"));
    })
    .catch(function(err){
      setState("bad","not deleted");
      toast("Couldn't delete: "+((err&&err.message)||"unknown error"));
    });
}

/* =========================================================
   export
   ========================================================= */
function csvCell(v){
  var s=(v==null?"":String(v));
  return /[",\n\r]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function exportCSV(){
  if(!jobs.length){ toast("Nothing to export yet."); return; }
  var cols=["company","role","location","status","deadline","applied_on","fit","source","link","keywords","requirements_met","requirements_gap","notes","job_description"];
  var lines=[cols.join(",")];
  jobs.slice().sort(byDeadline).forEach(function(j){
    var met=(j.requirements||[]).filter(function(r){return r.met;}).map(function(r){return r.text;}).join(" | ");
    var gap=(j.requirements||[]).filter(function(r){return !r.met;}).map(function(r){return r.text;}).join(" | ");
    lines.push([
      j.company, j.role, j.location, stageLabel[j.status]||j.status,
      j.deadline, j.appliedOn, j.fit, j.source, j.link,
      (j.keywords||[]).join(" | "), met, gap, j.notes, j.jd
    ].map(csvCell).join(","));
  });
  // BOM so Excel opens UTF-8 correctly
  var blob=new Blob(["﻿"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="job-applications-"+todayISO()+".csv";
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1000);
  toast("Exported "+jobs.length+" application"+(jobs.length===1?"":"s")+".");
}

function aiPrompt(){
  var open=jobs.filter(function(j){return j.status!=="closed";}).sort(byDeadline);
  var pick=open.length?open:jobs;
  if(!pick.length){ toast("Nothing to copy yet."); return; }
  var out=[];
  out.push("I am tailoring my CV for the roles below. My CV is attached (or pasted underneath).");
  out.push("");
  out.push("For each role, tell me: (1) which of my experiences to lead with and why, (2) which bullets to cut, (3) the exact wording from the job description I should mirror, and (4) any requirement I have no evidence for, stated plainly rather than papered over.");
  out.push("");
  out.push("Do not invent anything that is not already in my CV.");
  out.push("");
  out.push("=".repeat(60));
  pick.forEach(function(j,i){
    out.push("");
    out.push("ROLE "+(i+1)+": "+j.company+(j.role?" — "+j.role:""));
    out.push("-".repeat(60));
    if(j.location) out.push("Location: "+j.location);
    if(j.deadline) out.push("Deadline: "+j.deadline+"  ("+deadlineText(j)+")");
    out.push("Stage: "+(stageLabel[j.status]||j.status));
    if(j.link) out.push("Posting: "+j.link);
    if((j.keywords||[]).length) out.push("Keywords to mirror: "+j.keywords.join(", "));
    var gap=(j.requirements||[]).filter(function(r){return !r.met;}).map(function(r){return r.text;});
    if(gap.length) out.push("Known gaps: "+gap.join("; "));
    if(j.notes) out.push("My notes: "+j.notes);
    out.push("");
    out.push("FULL JOB DESCRIPTION:");
    out.push(j.jd||"(not recorded)");
    out.push("");
  });
  var txt=out.join("\n");

  function done(){ toast("Copied "+pick.length+" job"+(pick.length===1?"":"s")+" — paste into Claude or ChatGPT."); }
  function fallback(){
    var ta=el("textarea"); ta.value=txt;
    ta.style.position="fixed"; ta.style.top="-9999px"; document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand("copy"); done(); }
    catch(e){ toast("Couldn't copy automatically — use Export CSV instead."); }
    ta.remove();
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(fallback);
  } else fallback();
}

/* =========================================================
   render
   ========================================================= */
function visible(){
  var q=ui.q.trim().toLowerCase();
  return jobs.filter(function(j){
    if(ui.stage!=="all"&&j.status!==ui.stage) return false;
    if(!q) return true;
    return [j.company,j.role,j.location,j.jd,j.notes,j.source].join(" ").toLowerCase().indexOf(q)>-1;
  });
}
function renderPipe(){
  var nav=$("pipe"); nav.innerHTML="";
  var counts={all:jobs.length};
  STAGES.forEach(function(s){counts[s.id]=0;});
  jobs.forEach(function(j){ if(counts[j.status]!=null) counts[j.status]++; });
  [{id:"all",label:"All"}].concat(STAGES).forEach(function(s){
    var b=el("button"); b.setAttribute("aria-pressed",ui.stage===s.id?"true":"false");
    b.appendChild(el("b",null,String(counts[s.id]||0)));
    b.appendChild(el("span","lb",s.label));
    b.onclick=function(){ui.stage=s.id; render();};
    nav.appendChild(b);
  });
}
function card(j){
  var b=el("button","card");
  b.dataset.id=j.id; b.dataset.urg=urgency(j); b.draggable=true;
  b.appendChild(el("div","co",j.company||"Untitled"));
  if(j.role) b.appendChild(el("div","ro",j.role));
  var meta=el("div","meta");
  var dl=deadlineText(j);
  if(dl){var c=el("span","chip",dl); var u=urgency(j); if(u==="crit"||u==="soon")c.dataset.u=u; meta.appendChild(c);}
  else meta.appendChild(el("span","chip","no deadline"));
  if(j.location) meta.appendChild(el("span","chip",j.location));
  var fit=el("div","fit");
  for(var i=1;i<=5;i++){var d=el("i"); if(i<=(j.fit||0))d.className="on"; fit.appendChild(d);}
  fit.title="Fit "+(j.fit||0)+"/5";
  meta.appendChild(fit); b.appendChild(meta);
  b.onclick=function(){openDrawer(j.id);};
  b.addEventListener("dragstart",function(e){
    e.dataTransfer.setData("text/plain",j.id); e.dataTransfer.effectAllowed="move";
    b.classList.add("dragging");
  });
  b.addEventListener("dragend",function(){b.classList.remove("dragging");});
  return b;
}
function renderBoard(){
  var list=visible(), wrap=el("div","board");
  STAGES.forEach(function(s){
    var mine=list.filter(function(j){return j.status===s.id;}).sort(byDeadline);
    var col=el("div","col");
    var h=el("div","col-h"); h.appendChild(el("h2",null,s.label)); h.appendChild(el("span","n",String(mine.length)));
    col.appendChild(h);
    var drop=el("div","drop"); drop.dataset.stage=s.id;
    if(!mine.length) drop.appendChild(el("div","col-empty","—"));
    mine.forEach(function(j){drop.appendChild(card(j));});
    drop.addEventListener("dragover",function(e){e.preventDefault(); drop.classList.add("over");});
    drop.addEventListener("dragleave",function(){drop.classList.remove("over");});
    drop.addEventListener("drop",function(e){
      e.preventDefault(); drop.classList.remove("over");
      moveJob(e.dataTransfer.getData("text/plain"),s.id);
    });
    col.appendChild(drop); wrap.appendChild(col);
  });
  return wrap;
}
function renderList(){
  var list=visible().slice().sort(byDeadline), wrap=el("div","listwrap");
  if(!list.length){ wrap.appendChild(el("p","col-empty","Nothing matches.")); return wrap; }
  var t=el("table");
  t.innerHTML="<thead><tr><th>Company / role</th><th>Stage</th><th>Deadline</th><th>Left</th><th>Fit</th><th>Applied</th></tr></thead>";
  var tb=el("tbody");
  list.forEach(function(j){
    var tr=el("tr"); tr.tabIndex=0;
    var c1=el("td"); c1.appendChild(el("div","co",j.company||"Untitled"));
    if(j.role) c1.appendChild(el("div","ro",j.role));
    tr.appendChild(c1);
    var c2=el("td"); var s=el("span","stg",stageLabel[j.status]||j.status); s.dataset.s=j.status; c2.appendChild(s); tr.appendChild(c2);
    tr.appendChild(el("td","num",j.deadline||"—"));
    var c4=el("td","num"); var u=urgency(j);
    var left=el("span","chip",deadlineText(j)||"—"); if(u==="crit"||u==="soon")left.dataset.u=u;
    c4.appendChild(left); tr.appendChild(c4);
    tr.appendChild(el("td","num",(j.fit||0)+"/5"));
    tr.appendChild(el("td","num",j.appliedOn||"—"));
    tr.onclick=function(){openDrawer(j.id);};
    tr.onkeydown=function(e){if(e.key==="Enter")openDrawer(j.id);};
    tb.appendChild(tr);
  });
  t.appendChild(tb); wrap.appendChild(t); return wrap;
}
function renderEmpty(){
  var w=el("div","empty");
  w.appendChild(el("h2",null,"No applications yet"));
  w.appendChild(el("p",null,"Add the first role you're chasing. Paste the full job description with it — that's what makes the CV tailoring worth anything later."));
  var b=el("button","btn","Add your first job"); b.onclick=openAdd; w.appendChild(b);
  return w;
}
function render(){
  renderPipe();
  var v=$("view"); v.innerHTML="";
  $("vBoard").setAttribute("aria-pressed",ui.view==="board");
  $("vList").setAttribute("aria-pressed",ui.view==="list");
  if(!jobs.length){ v.appendChild(renderEmpty()); return; }
  v.appendChild(ui.view==="board"?renderBoard():renderList());
}

/* =========================================================
   mutations
   ========================================================= */
function find(id){return jobs.find(function(j){return j.id===id;});}
function moveJob(id,stage){
  var j=find(id); if(!j||j.status===stage) return;
  j.status=stage;
  if(stage==="applied"&&!j.appliedOn) j.appliedOn=todayISO();
  (j.timeline=j.timeline||[]).push({date:todayISO(),stage:stageLabel[stage],note:""});
  render();
  saveJob(j).then(function(){ toast(j.company+" → "+stageLabel[stage]); });
}

/* =========================================================
   fields
   ========================================================= */
function field(label,name,value,type,opts){
  var f=el("div","field"), id="f-"+name, input;
  var l=el("label",null,label); l.setAttribute("for",id); f.appendChild(l);
  if(type==="select"){
    input=el("select");
    (opts||[]).forEach(function(o){
      var op=el("option",null,o.label); op.value=o.id; if(o.id===value)op.selected=true; input.appendChild(op);
    });
  } else if(type==="textarea"){
    input=el("textarea"); input.value=value==null?"":value;
    if(opts&&opts.rows) input.rows=opts.rows;
    if(opts&&opts.placeholder) input.placeholder=opts.placeholder;
  } else {
    input=el("input"); input.type=type||"text"; input.value=value==null?"":value;
    if(opts&&opts.placeholder) input.placeholder=opts.placeholder;
    if(type==="number"){ input.min=(opts&&opts.min!=null)?opts.min:0; input.max=(opts&&opts.max!=null)?opts.max:5; }
  }
  input.id=id; input.name=name; f.appendChild(input);
  return f;
}

/* =========================================================
   drawer
   ========================================================= */
function openDrawer(id){
  var j=find(id); if(!j) return;
  ui.open=id;
  $("dTitle").textContent=j.company||"Untitled";
  $("dSub").textContent=[j.role,j.location,j.source?"via "+j.source:""].filter(Boolean).join(" · ")||"—";

  var b=$("dBody"); b.innerHTML="";
  var main=el("div","pane"), side=el("div","pane");

  var g=el("div","grid2");
  g.appendChild(field("Stage","status",j.status,"select",STAGES));
  g.appendChild(field("Deadline","deadline",j.deadline,"date"));
  g.appendChild(field("Applied on","appliedOn",j.appliedOn,"date"));
  g.appendChild(field("Fit (1–5)","fit",j.fit||0,"number",{min:0,max:5}));
  main.appendChild(g);

  if(j.link){
    var lw=el("div","field"); lw.appendChild(el("div","lb2","Posting"));
    var a=el("a","link",j.link); a.href=j.link; a.target="_blank"; a.rel="noopener noreferrer";
    lw.appendChild(a); main.appendChild(lw);
  }

  if((j.requirements||[]).length){
    var rw=el("div","field"); rw.appendChild(el("div","lb2","What they're asking for"));
    var ul=el("ul","reqs");
    j.requirements.forEach(function(r,i){
      var txt=(r&&r.text)!=null?r.text:String(r);
      var li=el("li"); if(!r.met) li.className="no";
      var cb=el("input"); cb.type="checkbox"; cb.checked=!!r.met; cb.id="req-"+i;
      cb.onchange=function(){ r.met=cb.checked; li.className=cb.checked?"":"no"; saveJob(j); };
      var lab=el("label",null,txt); lab.setAttribute("for","req-"+i);
      li.appendChild(cb); li.appendChild(lab); ul.appendChild(li);
    });
    rw.appendChild(ul); main.appendChild(rw);
  }

  if((j.keywords||[]).length){
    var kw=el("div","field"); kw.appendChild(el("div","lb2","Keywords to mirror"));
    var box=el("div","kw");
    j.keywords.forEach(function(k){box.appendChild(el("span","chip",k));});
    kw.appendChild(box); main.appendChild(kw);
  }

  main.appendChild(field("My notes","notes",j.notes,"textarea",{rows:5,placeholder:"What I need to remember about this one."}));

  if(j.jd){
    var box2=el("div","jdbox");
    var h=el("div","jdh"); h.appendChild(el("span",null,"Full job description"));
    var tog=el("button",null,"Show all"); h.appendChild(tog);
    var txt=el("div","jdtext",j.jd);
    tog.onclick=function(){ tog.textContent=box2.classList.toggle("open")?"Collapse":"Show all"; };
    box2.appendChild(h); box2.appendChild(txt); side.appendChild(box2);
  } else {
    side.appendChild(field("Job description","jd","","textarea",{rows:10,placeholder:"Paste it here — verbatim beats summarised."}));
  }

  if((j.timeline||[]).length){
    var tw=el("div","field"); tw.appendChild(el("div","lb2","History"));
    var tl=el("ul","hist");
    j.timeline.slice().reverse().forEach(function(t){
      tl.appendChild(el("li",null,t.date+"  ·  "+t.stage+(t.note?"  ·  "+t.note:"")));
    });
    tw.appendChild(tl); side.appendChild(tw);
  }

  b.appendChild(main);
  if(side.childNodes.length) b.appendChild(side);
  show("drawer");
}
function setWide(on){
  ui.wide=on;
  var p=$("drawer"); p.classList.toggle("wide",on);
  $("dWide").setAttribute("aria-pressed",on?"true":"false");
  $("dWideLbl").textContent=on?"Shrink":"Expand";
  var box=p.querySelector(".jdbox"); if(box&&on) box.classList.add("open");
}
function saveDrawer(){
  var j=find(ui.open); if(!j){ close(); return; }
  var b=$("dBody");
  function val(n){var e=b.querySelector('[name="'+n+'"]'); return e?e.value:undefined;}
  var ns=val("status");
  if(ns&&ns!==j.status){
    j.status=ns;
    (j.timeline=j.timeline||[]).push({date:todayISO(),stage:stageLabel[ns],note:""});
    if(ns==="applied"&&!j.appliedOn) j.appliedOn=todayISO();
  }
  var dl=val("deadline"); if(dl!==undefined) j.deadline=dl||"";
  var ao=val("appliedOn"); if(ao!==undefined) j.appliedOn=ao||"";
  var ft=val("fit"); if(ft!==undefined) j.fit=Math.max(0,Math.min(5,parseInt(ft,10)||0));
  var nt=val("notes"); if(nt!==undefined) j.notes=nt;
  var jd=val("jd"); if(jd!==undefined&&jd.trim()) j.jd=jd.trim();
  close();
  saveJob(j).then(function(){ toast("Saved "+(j.company||"job")); });
}

/* =========================================================
   add
   ========================================================= */
var ADD=[
  ["Company","company","text",{placeholder:"e.g. Procter & Gamble"}],
  ["Role","role","text",{placeholder:"Graduate Programme — Strategy"}],
  ["Location","location","text",{placeholder:"Hong Kong"}],
  ["Deadline","deadline","date",{}],
  ["Fit (1–5)","fit","number",{min:0,max:5}],
  ["Stage","status","select",null],
  ["Posting link","link","url",{placeholder:"https://…"}],
  ["Where I found it","source","text",{placeholder:"University careers portal"}]
];
function openAdd(){
  var f=$("addForm"); f.innerHTML="";
  var g=el("div","grid2");
  ADD.forEach(function(a){
    g.appendChild(a[2]==="select"
      ? field(a[0],a[1],"interested","select",STAGES)
      : field(a[0],a[1],a[1]==="fit"?3:"",a[2],a[3]));
  });
  f.appendChild(g);
  f.appendChild(field("Paste the job description","jd","","textarea",{rows:10}));
  f.appendChild(el("p","hint","Verbatim beats summarised — the exact wording is what the CV gets tailored against, and what the export hands to the AI."));
  show("addPanel");
  setTimeout(function(){ var c=f.querySelector('[name="company"]'); if(c)c.focus(); },240);
}
function saveAdd(){
  var f=$("addForm");
  function val(n){var e=f.querySelector('[name="'+n+'"]'); return e?e.value.trim():"";}
  var company=val("company");
  if(!company){ toast("A company name at least."); var c=f.querySelector('[name="company"]'); if(c)c.focus(); return; }
  var j={
    company:company, role:val("role"), location:val("location"),
    deadline:val("deadline"), fit:Math.max(0,Math.min(5,parseInt(val("fit"),10)||0)),
    status:val("status")||"interested", link:val("link"), source:val("source"),
    jd:val("jd"), notes:"", requirements:[], keywords:[],
    timeline:[{date:todayISO(),stage:"Added",note:""}]
  };
  if(j.status==="applied") j.appliedOn=todayISO();
  close();
  addJob(j);
}

/* =========================================================
   panels
   ========================================================= */
var openPanel=null;
function show(id){
  var p=$(id); p.hidden=false;
  requestAnimationFrame(function(){p.classList.add("on");});
  $("scrim").classList.add("on");
  openPanel=id;
}
function close(){
  if(!openPanel) return;
  var p=$(openPanel); p.classList.remove("on");
  $("scrim").classList.remove("on");
  setTimeout(function(){p.hidden=true;},220);
  openPanel=null; ui.open=null;
}

/* =========================================================
   wiring
   ========================================================= */
function wire(){
  $("q").addEventListener("input",function(e){ui.q=e.target.value; render();});
  $("vBoard").onclick=function(){ui.view="board"; render();};
  $("vList").onclick=function(){ui.view="list"; render();};
  $("addBtn").onclick=openAdd;
  $("csvBtn").onclick=exportCSV;
  $("aiBtn").onclick=aiPrompt;
  $("dSave").onclick=saveDrawer;
  $("dCancel").onclick=close;
  $("dClose").onclick=close;
  $("dWide").onclick=function(){setWide(!ui.wide);};
  $("dDel").onclick=function(){
    var j=find(ui.open); if(!j) return;
    var id=ui.open; close(); removeJob(id);
  };
  $("aSave").onclick=saveAdd;
  $("aCancel").onclick=close;
  $("aClose").onclick=close;
  $("scrim").onclick=close;
  $("signOut").onclick=function(){ sb.auth.signOut(); };
  document.addEventListener("keydown",function(e){
    var typing=/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    if(e.key==="Escape") close();
    if(!openPanel&&!typing&&(e.key==="n"||e.key==="N")){ e.preventDefault(); openAdd(); }
    if(openPanel==="drawer"&&!typing&&(e.key==="e"||e.key==="E")){ e.preventDefault(); setWide(!ui.wide); }
  });
}

/* =========================================================
   boot
   ========================================================= */
function enterApp(){
  $("gate").hidden=true; $("app").hidden=false;
  $("whoEmail").textContent=user.email||"";
  loadJobs();
}

function boot(){
  sb.auth.getSession().then(function(r){
    var s=r.data&&r.data.session;
    if(s&&s.user){ user=s.user; enterApp(); }
    else authScreen("signin");
  });
}

function init(){
  var cfg=window.GRAD_PIPELINE_CONFIG||{};
  var url=(cfg.SUPABASE_URL||"").trim(), key=(cfg.SUPABASE_ANON_KEY||"").trim();

  if(!window.supabase||!window.supabase.createClient){
    showSetup("The Supabase library didn't load. Check your internet connection, or whether a content blocker is blocking cdn.jsdelivr.net.");
    return;
  }
  if(!url||!key||/PASTE_YOUR/.test(url)||/PASTE_YOUR/.test(key)){
    showSetup("config.js still has its placeholder values in it.");
    return;
  }
  url = url.replace(/\/+$/,"");   // a trailing slash breaks every request
  if(/supabase\.com\/dashboard/i.test(url)){
    var ref=(url.match(/\/project\/([a-z0-9]{16,})/i)||[])[1];
    showSetup("That's the Supabase dashboard address, not your project URL."+
      (ref ? " Yours is https://"+ref+".supabase.co" : " It looks like https://yourprojectref.supabase.co"));
    return;
  }
  if(!/^https:\/\/[a-z0-9-]+\.supabase\.(co|in|red)$/i.test(url)){
    showSetup("That doesn't look like a Supabase project URL. It should look like https://yourprojectref.supabase.co — no trailing slash, no /dashboard.");
    return;
  }
  // Accept both key formats Supabase issues: the legacy anon JWT (eyJ...)
  // and the newer publishable key (sb_publishable_...).
  var isLegacy = /^eyJ/.test(key), isPublishable = /^sb_publishable_/.test(key);

  // Refuse a secret key outright. It bypasses every RLS policy, and this
  // file is published, so pasting one here is a real breach — say so loudly
  // rather than quietly connecting and appearing to work.
  if(/^sb_secret_/.test(key)){
    showSetup("That is a SECRET key (sb_secret_...). It bypasses all security policies and must never go in config.js, which is published. Remove it, rotate it in the Supabase dashboard now, and use the publishable key instead.");
    return;
  }
  if(isLegacy){
    try{
      var body=JSON.parse(atob(key.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")));
      if(body && body.role === "service_role"){
        showSetup("That is the SERVICE_ROLE key. It bypasses every Row Level Security policy, and config.js is published to the web. Remove it, rotate it in the Supabase dashboard immediately, then use the anon public key instead.");
        return;
      }
    }catch(e){ /* not a decodable JWT; fall through to the shape check */ }
  }
  if(!isLegacy && !isPublishable){
    showSetup("That doesn't look like a Supabase API key. Use either the anon public key (a long string starting with \"eyJ\") or the newer publishable key (starting with \"sb_publishable_\").");
    return;
  }

  sb=window.supabase.createClient(url,key);
  wire();

  sb.auth.onAuthStateChange(function(event,session){
    if(event==="PASSWORD_RECOVERY"){ newPasswordScreen(); return; }
    if(event==="SIGNED_IN"){
      user=session.user;
      if($("app").hidden) enterApp();
      return;
    }
    if(event==="SIGNED_OUT"){
      user=null; jobs=[]; close();
      authScreen("signin","Signed out.","");
      return;
    }
  });

  boot();
}

if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",init);
else init();
})();
</script>
